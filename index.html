<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Counter (Real Camera Edition)</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <style>
        body { margin: 0; display: flex; flex-direction: column; align-items: center; background-color: #1a1a1a; color: white; font-family: sans-serif; padding-top: 10px; }
        .container { position: relative; margin-top: 10px; width: 100%; max-width: 640px; }
        video { display: none; } /* ซ่อน Video element แท้ แต่เราจะวาดลง Canvas แทน */
        canvas { width: 100%; height: auto; background-color: black; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        #ui-panel { position: absolute; top: 15px; left: 15px; text-align: left; background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 10px; }
        #counter { font-size: 60px; font-weight: bold; color: #00ffcc; margin: 0; line-height: 1; }
        #status { font-size: 16px; color: #eee; margin-bottom: 5px; }
        .controls { margin-top: 15px; width: 90%; max-width: 400px; background: #333; padding: 15px; border-radius: 10px; }
        input[type=range] { width: 100%; }
    </style>
</head>
<body>

    <h3 style="margin: 0 0 10px 0;">Stroke Counter (กล้องหลัง)</h3>

    <div class="container">
        <video id="input_video" autoplay playsinline></video>
        <canvas id="output_canvas" width="640" height="480"></canvas>
        
        <div id="ui-panel">
            <div id="status">จำนวนครั้ง</div>
            <div id="counter">0</div>
        </div>
    </div>

    <div class="controls">
        <label>ระยะขยับขั้นต่ำ (Threshold): <span id="sensValue">2.5%</span></label>
        <br>
        <span style="font-size: 12px; color:#aaa;">(เลื่อนซ้าย = ขยับนิดเดียวนับ / เลื่อนขวา = ต้องขยับกว้างมากถึงนับ)</span>
        <input type="range" id="sensitivity" min="0.5" max="15" value="2.5" step="0.5">
    </div>

    <script>
        const videoElement = document.getElementById('input_video');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const counterElement = document.getElementById('counter');
        const sensitivitySlider = document.getElementById('sensitivity');
        const sensValueLabel = document.getElementById('sensValue');

        // ตัวแปรสำหรับอัลกอริทึมนับจังหวะ
        let strokeCount = 0;
        let isMovingDown = true;
        let peakY = 1.0;   
        let valleyY = 0.0; 
        
        // ดึงค่า Threshold จาก Slider (ตั้งต้นที่ 2.5% ทำให้จับการเคลื่อนไหวสมจริงขึ้นมาก)
        let THRESHOLD = sensitivitySlider.value / 100;

        // อัปเดตค่าความไวเมื่อมีการเลื่อน Slider
        sensitivitySlider.addEventListener('input', function() {
            THRESHOLD = this.value / 100;
            sensValueLabel.innerText = this.value + '%';
        });

        function onResults(results) {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // วาดภาพกล้องจริงลงบน Canvas
            if (results.image) {
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // วาดเส้นกราฟิกทับมือ (เพื่อความแม่นยำในการดูว่า AI จับตรงไหน)
                drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00ffcc', lineWidth: 2});
                drawLandmarks(canvasCtx, landmarks, {color: '#ff0000', lineWidth: 1, radius: 2});

                // ใช้พิกัด Landmark จุดที่ 9 (โคนนิ้วกลาง) จะเสถียรกว่าข้อมือเวลาที่มีการกำมือ
                let trackPointY = landmarks[9].y; 

                // อัลกอริทึม Peak-Valley 
                if (isMovingDown) {
                    if (trackPointY > valleyY) valleyY = trackPointY; 
                    if (valleyY - trackPointY > THRESHOLD) {
                        isMovingDown = false;
                        peakY = trackPointY; 
                        strokeCount++;  
                        counterElement.innerText = strokeCount;
                    }
                } else {
                    if (trackPointY < peakY) peakY = trackPointY; 
                    if (trackPointY - peakY > THRESHOLD) {
                        isMovingDown = true;
                        valleyY = trackPointY; 
                    }
                }
            }
            canvasCtx.restore();
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});
        hands.setOptions({
            maxNumHands: 1, 
            modelComplexity: 1,
            minDetectionConfidence: 0.6, // เพิ่มความแม่นยำในการจับ
            minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        // ฟังก์ชันเรียกใช้กล้องหลังแบบกำหนดเองเพื่อบังคับ (environment)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: { ideal: "environment" }, // บังคับกล้องหลัง
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                });
                videoElement.srcObject = stream;
                
                videoElement.onloadedmetadata = () => {
                    videoElement.play();
                    
                    // สร้าง Loop ดึงภาพส่งเข้า AI
                    let lastVideoTime = -1;
                    async function detectionLoop() {
                        if (!videoElement.paused && !videoElement.ended) {
                            if (videoElement.currentTime !== lastVideoTime) {
                                lastVideoTime = videoElement.currentTime;
                                await hands.send({image: videoElement});
                            }
                        }
                        requestAnimationFrame(detectionLoop);
                    }
                    detectionLoop();
                };
            } catch (err) {
                alert("ไม่สามารถเปิดกล้องหลังได้: " + err.message);
            }
        }

        startCamera();
    </script>
</body>
</html>
